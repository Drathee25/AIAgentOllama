name: Generate Itineraries

on:
  repository_dispatch:
    types: [new-trip] # fired by the sheet's intake webhook on new submissions
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab, for testing

jobs:
  generate:
    runs-on: ubuntu-latest
    # Generous: each Ollama call gets up to 15 min of its own headroom (see
    # generate.js). Rows in a batch now run concurrently, not sequentially,
    # but this stays high to comfortably absorb install/setup + retries.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-llama3

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        env:
          # Must match MAX_CONCURRENT in generate.js so concurrent requests
          # actually run concurrently instead of queuing behind each other.
          OLLAMA_NUM_PARALLEL: 2
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            curl -s http://localhost:11434/api/version && exit 0
            sleep 2
          done
          echo "Ollama did not become ready in time" >&2
          exit 1

      - name: Pull model (no-op if already cached)
        run: ollama pull llama3

      - name: Install runner dependencies
        working-directory: github-actions-runner
        run: npm install

      - name: Generate pending itineraries
        working-directory: github-actions-runner
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          OLLAMA_MODEL: llama3
        run: node generate.js
