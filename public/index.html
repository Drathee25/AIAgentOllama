<body>
  <h1>Itinerary Agent</h1>
  <p>
    This site hosts a Netlify scheduled function (<code>process-itineraries</code>)
    that reads pending trip rows from a Google Sheet, generates an itinerary via
    a remote Ollama server, renders it as a PDF, and emails it to the traveler.
  </p>
  <p>See the repo README for setup and configuration.</p>
</body>
